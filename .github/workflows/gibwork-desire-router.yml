name: Gibwork Desire Router CI

on:
  push:
    branches: [gibwork-desire-router]
    paths:
      - 'gibwork-desire-router/**'
      - '.github/workflows/gibwork-desire-router.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gibwork-desire-router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build and test
        run: npm test
      - name: Capture dry-run demo
        run: |
          node dist/src/cli.js route "Record three UGC videos in Cairo and attach source files" --budget 100 --hours 12 | tee demo-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desire-router-demo-output
          path: gibwork-desire-router/demo-output.txt
